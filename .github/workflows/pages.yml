name: Deploy README to Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp README.md _site/index.md
          printf 'title: stones\ntheme: jekyll-theme-cayman\n' > _site/_config.yml

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site
          destination: ./_site_out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site_out

      - id: deploy
        uses: actions/deploy-pages@v4
